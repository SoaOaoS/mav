name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    # A throwaway database for the tests that need a real one (backup round trip).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mavtest
          POSTGRES_PASSWORD: mavtest
          POSTGRES_DB: mavtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mavtest" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MAV_TEST_PG_DSN: host=127.0.0.1 port=5432 user=mavtest password=mavtest dbname=mavtest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies (worker)
        run: python -m pip install -q -r bot/requirements.txt

      # The browser tests (tests/test_e2e_*.py) drive the real web app in
      # Chromium against the fake engine.
      - name: Playwright and Chromium
        run: |
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium

      - name: Shell scripts (shellcheck)
        run: |
          shellcheck -S warning install.sh get.sh run-opencode.sh scripts/mav \
            scripts/next-version.sh scripts/agent-hashes.sh scripts/build-demo.sh scripts/migrate-to-docker.sh docker/entrypoint.sh dashboard/tools/make_certs.sh tests/*.sh

      - name: Python (compile)
        run: python3 -m py_compile bot/*.py dashboard/server/*.py dashboard/tools/*.py

      - name: JavaScript (syntax)
        run: |
          for f in dashboard/assets/js/*.js; do node --check "$f"; done
          node --check dashboard/sw.js
          node --check docs/site.js

      - name: JSON
        run: python3 -m json.tool dashboard/mcp-catalog.json > /dev/null

      - name: Helper checksums up to date
        run: |
          scripts/agent-hashes.sh
          git diff --exit-code agents/shipped.sha256 \
            || { echo "::error::run scripts/agent-hashes.sh and commit agents/shipped.sha256"; exit 1; }

      - name: Demo copy up to date
        run: |
          scripts/build-demo.sh
          git diff --exit-code docs/demo \
            || { echo "::error::run scripts/build-demo.sh and commit docs/demo"; exit 1; }
          test -z "$(git status --porcelain docs/demo)" \
            || { echo "::error::docs/demo has untracked files: run scripts/build-demo.sh and commit"; exit 1; }

      - name: Tests
        run: |
          bash tests/test_next_version.sh
          bash tests/test_cli.sh
          bash tests/test_install.sh
          bash tests/test_postgres.sh
          python3 -m unittest discover -s tests -v

  # The Docker install, end to end: build the image, start the whole stack
  # (Postgres, engine, web, worker) and check that it answers.
  docker:
    # The whole stack on x86 and on 64-bit ARM (what a Raspberry Pi 4/5 runs).
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    name: docker (${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }})
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: |
          cp .env.example .env
          docker compose build
          docker compose up -d --wait --wait-timeout 240

      - name: Smoke test
        run: |
          set -x
          curl -fsS http://127.0.0.1:8787/api/health
          curl -fsS http://127.0.0.1:8787/api/auth/state | grep -q setup_needed
          curl -fsS http://127.0.0.1:8787/ | grep -q '<title>Mav</title>'
          docker compose exec -T web python3 -c "import urllib.request; print(urllib.request.urlopen('http://engine:4096/global/health').read())"
          docker compose exec -T web test -f /data/home/.config/opencode/agent/assistant.md
          docker compose exec -T web test -d /data/home/workspace/mav-files
          docker compose ps
          docker compose logs worker | grep -q "worker ready"

      - name: Restart from the web app reaches the engine
        run: |
          before="$(docker compose exec -T engine cat /data/run/engine.started)"
          docker compose exec -T web python3 -c "import pathlib, time; pathlib.Path('/data/run/engine.restart').write_text(str(time.time()))"
          for i in $(seq 30); do
            sleep 2
            now="$(docker compose exec -T engine cat /data/run/engine.started)"
            [ "$now" != "$before" ] && break
          done
          [ "$now" != "$before" ] || { echo "::error::the engine did not restart"; exit 1; }

      - name: Installer (dry checks)
        run: bash tests/test_install.sh

      - name: Memory at rest
        run: |
          sleep 20
          uname -m
          docker stats --no-stream --format "table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}"
          docker image ls --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}" | grep -E "mav|postgres"

      - name: Logs
        if: always()
        run: docker compose logs --no-color | tail -n 200
