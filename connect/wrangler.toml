# Mav Connect — Cloudflare Worker (see connect/README.md)
name = "mav-connect"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
# Ed25519 public key of the licence signer (same as dashboard/server/mav_licence.py)
LICENCE_PUBKEY = "XzZKcHvh7D5w-Jyh-qcoYFvkJ4nab1fHLIRSBf9ltcE"
QUOTA_BYTES = "2147483648"   # 2 GB per licence
KEEP = "14"                  # backups kept per licence (two weeks of dailies)
REVOKED = ""                 # comma-separated licence ids (refunds, abuse)

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "mav-connect-backups"
